name: Monitor Airtable dropdown

on:
  workflow_dispatch:
    inputs:
      test_listing:
        description: "Optional listing row to test Telegram enrichment"
        required: false
        default: ""
        type: string
  schedule:
    - cron: "2/5 * * * *"

permissions:
  contents: write

concurrency:
  group: airtable-dropdown-monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Check Airtable and notify Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          AIRTABLE_FORM_URL: "https://airtable.com/appsseXTOVx59HC0W/pagcVengefPFQvMZC/form"
          AIRTABLE_FIELD_LABEL: "Project Applying For"
          AIRTABLE_ADD_UNIT_TEXT: "Add unit"
          TEST_LISTING: ${{ inputs.test_listing || '' }}
        run: python monitor.py

      - name: Save latest snapshot
        if: success()
        run: |
          if git diff --quiet -- state.json; then
            echo "No state change."
            exit 0
          fi
          git config user.name "airtable-monitor-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git commit -m "Update Airtable monitor state [skip ci]"
          git push

      - name: Upload debug files if scraping fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: airtable-debug
          path: debug/
          if-no-files-found: ignore
          retention-days: 7
