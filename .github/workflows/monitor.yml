name: Monitor Airtable dropdown

on:
  workflow_dispatch:
    inputs:
      test_listing:
        description: "Optional listing row to test Telegram enrichment"
        required: false
        default: ""
        type: string
  schedule:
    - cron: "2/5 * * * *"

permissions:
  contents: write

concurrency:
  group: airtable-dropdown-monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check Airtable and notify Telegram
        id: monitor
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          AIRTABLE_FORM_URL: "https://airtable.com/appsseXTOVx59HC0W/pagcVengefPFQvMZC/form"
          AIRTABLE_FIELD_LABEL: "Project Applying For"
          AIRTABLE_ADD_UNIT_TEXT: "Add unit"
          TEST_LISTING: ${{ inputs.test_listing || '' }}
        run: python monitor.py

      - name: Save monitor state, history, and health
        if: always()
        run: |
          git config user.name "airtable-monitor-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add state.json history.json health.json 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No persistent monitor changes."
            exit 0
          fi

          git commit -m "Update Airtable monitor data [skip ci]"
          git push

      - name: Upload debug files if monitor failed
        if: steps.monitor.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: airtable-debug
          path: debug/
          if-no-files-found: ignore
          retention-days: 7

      - name: Mark workflow failed when monitor failed
        if: steps.monitor.outcome == 'failure'
        run: |
          echo "The monitor step failed. Persistent health state was saved above."
          exit 1
